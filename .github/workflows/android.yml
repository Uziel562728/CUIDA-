name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Removed android-actions/setup-android@v3 as it failed and ubuntu-latest already has Android SDK

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        run: npm run build:mobile

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Building SIGNED Release APK"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
              -PversionCode=${{ github.run_number }}
          else
            echo "Building UNSIGNED Release APK (Keystore secrets not found)"
            ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          fi

      - name: Rename APK
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            mv android/app/build/outputs/apk/release/app-release.apk CUIDA-Release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            mv android/app/build/outputs/apk/release/app-release-unsigned.apk CUIDA-Release-unsigned.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CUIDA-Release*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
