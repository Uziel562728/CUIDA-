name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        run: npm run build:mobile

      - name: Fix gradlew permissions
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK (Prueba tecnica)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Check Keystore Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Faltan los secretos de firma (KEYSTORE_BASE64). No se puede publicar una APK Release final sin firma. Por favor configura los GitHub Secrets."
            exit 1
          fi

      - name: Build Signed Release APK
        working-directory: ./android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building SIGNED Release APK"
          # Convertir base64 a jks usando la ruta absoluta segura para evitar problemas de Gradle
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $(pwd)/app/release.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASS}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS_VAL}" \
            -Pandroid.injected.signing.key.password="${KEY_PASS}" \
            -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk CUIDA-Release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CUIDA-Release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
