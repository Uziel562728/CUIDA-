name: CUIDA+ live updates

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capgo-production
  cancel-in-progress: true

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for native changes
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Cannot compare with previous commit. Publish a signed APK, then run this workflow manually to seed Capgo.'
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(android/|ios/|capacitor\.config\.ts$)'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Native files changed; publish a signed APK before deploying these web assets over the air.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require Capgo token
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo '::error::Add CAPGO_TOKEN in repository Actions secrets after registering com.cuida.app in Capgo.'
            exit 1
          fi

      - name: Setup Node
        if: steps.native.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.native.outputs.skip != 'true'
        run: npm ci

      - name: Build Capacitor web assets
        if: steps.native.outputs.skip != 'true'
        run: |
          npm run build:ota
          test -f dist/index.html

      - name: Configure Capgo Channel
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx --yes @capgo/cli@latest channel set production com.cuida.app --disable-auto-update metadata --no-downgrade

      - name: Publish to Capgo production
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          # Prerelease trap fix: create a version that is strictly > 1.2.2
          # e.g., 1.2.3-ota.X
          APP_MAJOR_MINOR=$(echo $APP_VERSION | cut -d. -f1,2)
          APP_PATCH=$(echo $APP_VERSION | cut -d. -f3)
          NEXT_PATCH=$((APP_PATCH + 1))
          BUNDLE_VERSION="${APP_MAJOR_MINOR}.${NEXT_PATCH}-ota.${{ github.run_number }}"
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> $GITHUB_ENV
          
          echo "Uploading BUNDLE_VERSION=$BUNDLE_VERSION with min-update-version=$APP_VERSION"
          npx --yes @capgo/cli@latest bundle upload com.cuida.app --path ./dist --channel production --bundle $BUNDLE_VERSION --min-update-version $APP_VERSION

      - name: Capgo Delivery Verification via Probe
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          echo "==== Probing Update for Current Native (1.2.2) ===="
          npx --yes @capgo/cli@latest probe --platform android > probe_current.txt
          cat probe_current.txt
          if ! grep -q "$BUNDLE_VERSION" probe_current.txt; then
             echo "::error::Capgo probe indicates 1.2.2 will NOT receive $BUNDLE_VERSION."
             exit 1
          fi
          
          echo "==== Probing Update for Older Native (1.2.0) ===="
          # Temporarily downgrade package.json to trick probe into simulating an older app
          npm version 1.2.0 --no-git-tag-version
          npx --yes @capgo/cli@latest probe --platform android > probe_old.txt
          cat probe_old.txt
          if grep -q "$BUNDLE_VERSION" probe_old.txt; then
             echo "::error::Security Failure: Capgo probe indicates 1.2.0 WOULD receive $BUNDLE_VERSION!"
             exit 1
          fi
          
          git restore package.json package-lock.json
          
          echo "✅ Strict audit passed: Capgo explicitly confirmed correct delivery logic in the cloud."
