name: CUIDA+ live updates

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capgo-production
  cancel-in-progress: true

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for native changes
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Cannot compare with previous commit. Publish a signed APK, then run this workflow manually to seed Capgo.'
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(android/|ios/|capacitor\.config\.ts$)'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Native files changed; publish a signed APK before deploying these web assets over the air.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require Capgo token
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo '::error::Add CAPGO_TOKEN in repository Actions secrets after registering com.cuida.app in Capgo.'
            exit 1
          fi

      - name: Setup Node
        if: steps.native.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.native.outputs.skip != 'true'
        run: npm ci

      - name: Build Capacitor web assets
        if: steps.native.outputs.skip != 'true'
        run: |
          npm run build:ota
          test -f dist/index.html

      - name: Safely Rollback and Isolate Production
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          echo "Rolling back production to safe state (1.0.10) to stop untested OTAs..."
          # CRITICAL: We MUST use --no-downgrade to prevent APK 1.2.2 from retrogressing to 1.0.10!
          npx --yes @capgo/cli@latest channel set production com.cuida.app --bundle 1.0.10 --disable-auto-update none --no-downgrade || true

      - name: Publish Untethered Bundle for Testing
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APP_MAJOR_MINOR=$(echo $APP_VERSION | cut -d. -f1,2)
          APP_PATCH=$(echo $APP_VERSION | cut -d. -f3)
          NEXT_PATCH=$((APP_PATCH + 1))
          BUNDLE_VERSION="${APP_MAJOR_MINOR}.${NEXT_PATCH}-ota.${{ github.run_number }}"
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> $GITHUB_ENV
          
          # Use a sandbox channel to upload and test before touching production
          npx --yes @capgo/cli@latest channel add audit_test com.cuida.app || true
          npx --yes @capgo/cli@latest bundle upload com.cuida.app --path ./dist --channel audit_test --bundle $BUNDLE_VERSION --min-update-version $APP_VERSION

      - name: Capgo Probe Evaluation
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx --yes @capgo/cli@latest channel set audit_test com.cuida.app --bundle $BUNDLE_VERSION --disable-auto-update metadata --no-downgrade
          
          # Fix build.gradle regex issue for capgo CLI probe
          sed -i "s/versionCode .*/versionCode 1/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"1.2.2\"/" android/app/build.gradle
          
          # Point local config to audit_test explicitly (Capgo requires 'channel' property)
          sed -i "s/defaultChannel: 'production'/channel: 'audit_test', defaultChannel: 'audit_test'/" capacitor.config.ts
          
          echo "==== PROBING 1.2.2 ON METADATA STRATEGY ===="
          npx --yes @capgo/cli@latest probe --platform android > probe_current.txt || true
          cat probe_current.txt
          
          echo "==== PROBING 1.2.0 ON METADATA STRATEGY ===="
          npm version 1.2.0 --no-git-tag-version
          sed -i "s/versionName \"1.2.2\"/versionName \"1.2.0\"/" android/app/build.gradle
          npx --yes @capgo/cli@latest probe --platform android > probe_old.txt || true
          cat probe_old.txt
          
          git restore android/app/build.gradle package.json package-lock.json capacitor.config.ts
          
          if ! grep -q "$BUNDLE_VERSION" probe_current.txt; then
             echo "::error::1.2.2 WILL NOT receive $BUNDLE_VERSION. Keeping production rolled back."
             exit 1
          fi
          
          if grep -q "$BUNDLE_VERSION" probe_old.txt; then
             echo "::error::1.2.0 IS VULNERABLE! It would receive $BUNDLE_VERSION. Keeping production rolled back."
             exit 1
          fi
          
          echo "✅ Probes verified! 1.2.2 gets the update, 1.2.0 is excluded."

      - name: Promote to Production
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          echo "Promoting $BUNDLE_VERSION to production channel..."
          npx --yes @capgo/cli@latest channel set production com.cuida.app --bundle $BUNDLE_VERSION --disable-auto-update metadata --no-downgrade
