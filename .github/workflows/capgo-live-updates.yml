name: CUIDA+ live updates

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capgo-production
  cancel-in-progress: true

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for native changes
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Cannot compare with previous commit. Publish a signed APK, then run this workflow manually to seed Capgo.'
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(android/|ios/|capacitor\.config\.ts$)'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Native files changed; publish a signed APK before deploying these web assets over the air.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require Capgo token
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo '::error::Add CAPGO_TOKEN in repository Actions secrets after registering com.cuida.app in Capgo.'
            exit 1
          fi

      - name: Setup Node
        if: steps.native.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.native.outputs.skip != 'true'
        run: npm ci

      - name: Build Capacitor web assets
        if: steps.native.outputs.skip != 'true'
        run: |
          npm run build:ota
          test -f dist/index.html

      - name: Configure Capgo Channel
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx --yes @capgo/cli@latest channel set production com.cuida.app --disable-auto-update metadata

      - name: Publish to Capgo production
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $APP_VERSION | cut -d. -f1,2)
          BUNDLE_VERSION="${MAJOR_MINOR}.999${{ github.run_number }}"
          echo "Uploading BUNDLE_VERSION=$BUNDLE_VERSION with min-update-version=$APP_VERSION"
          npx --yes @capgo/cli@latest bundle upload com.cuida.app --path ./dist --channel production --bundle $BUNDLE_VERSION --min-update-version $APP_VERSION

      - name: Capgo Strict Audit
        if: steps.native.outputs.skip != 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $APP_VERSION | cut -d. -f1,2)
          BUNDLE_VERSION="${MAJOR_MINOR}.999${{ github.run_number }}"
          
          echo "==== Verifying Channel Strategy ===="
          npx --yes @capgo/cli@latest channel list com.cuida.app > channels.txt
          cat channels.txt
          if ! grep -i "production" channels.txt | grep -iq "metadata"; then
            echo "::error::production channel does not use metadata strategy!"
            exit 1
          fi
          
          echo "==== Verifying Current Assigned Bundle ===="
          npx --yes @capgo/cli@latest channel currentBundle production com.cuida.app > current.txt
          cat current.txt
          if ! grep -q "$BUNDLE_VERSION" current.txt; then
             echo "::error::Production channel is not pointing to our uploaded bundle $BUNDLE_VERSION!"
             exit 1
          fi
          
          echo "==== Verifying Bundle Properties ===="
          npx --yes @capgo/cli@latest bundle list com.cuida.app > bundles.txt
          cat bundles.txt
          if ! grep "$BUNDLE_VERSION" bundles.txt | grep -q "$APP_VERSION"; then
             echo "::error::Bundle $BUNDLE_VERSION does not enforce min_update_version $APP_VERSION!"
             exit 1
          fi
          
          echo "✅ Strict audit passed: Production channel uses metadata, points to $BUNDLE_VERSION, which enforces min native version $APP_VERSION."
